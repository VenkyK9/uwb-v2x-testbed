# ----------------------------------------------------------------------------
# UWB_V2X
# Status : Proposed. No run is recorded.
# About  : slam_toolbox parameters for a hand-carried LiDAR (odom_frame = base_link).
# ----------------------------------------------------------------------------
slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Topic
    scan_topic: /scan

    # Frames
    map_frame: map
    odom_frame: base_link    # NO separate odom in handheld mode
    base_frame: base_link

    mode: mapping

    # Basic tuning
    resolution: 0.05
    max_laser_range: 8.0
    map_update_interval: 3.0
    transform_publish_period: 0.05

    # Motion thresholds (small because hand motion can be jerky)
    linear_update: 0.05
    angular_update: 0.05

    # Buffer
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0

    lookup_transform_timeout_sec: 0.5
