# ----------------------------------------------------------------------------
# UWB_V2X
# Status : Proposed. No run is recorded.
# About  : Minimal Nav2 parameters (planner, controller, costmaps fed by /scan) for bench validation.
# ----------------------------------------------------------------------------
amcl:   # you might skip AMCL now; leave it disabled or use slam pose
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    use_sim_time: false
    default_nav_to_pose_bt_xml: "navigate_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      global_frame: map
      robot_base_frame: base_link

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true

# Costmaps
global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 2.0
    publish_frequency: 1.0
    resolution: 0.05
    size_x: 20.0
    size_y: 20.0
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: "lidar"
      lidar:
        topic: /scan
        clearing: true
        marking: true
        data_type: "LaserScan"
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.4

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map     # in handheld mode, ok to use map
    robot_base_frame: base_link
    update_frequency: 10.0
    publish_frequency: 5.0
    resolution: 0.05
    size_x: 5.0
    size_y: 5.0
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: "lidar"
      lidar:
        topic: /scan
        clearing: true
        marking: true
        data_type: "LaserScan"
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.4
